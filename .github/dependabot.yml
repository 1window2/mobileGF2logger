version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      # Every two months, on the 1st. Security updates are not bound to this schedule.
      interval: "cron"
      cronjob: "0 9 1 */2 *"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
