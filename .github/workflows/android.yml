name: Android

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Install required CMake
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1"

      - name: Test, lint, and build unsigned verification release
        run: >
          ./gradlew
          :protocol:testDebugUnitTest
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleRelease
          -PallowUnsignedRelease=true
          --no-daemon
          --stacktrace

      - name: Verify and stage non-distributable artifact
        shell: bash
        run: |
          set -euo pipefail

          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "${apk}"

          apksigner="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "${apksigner}"

          if "${apksigner}" verify "${apk}"; then
            echo "CI verification APK was unexpectedly signed." >&2
            exit 1
          fi

          mkdir -p ci-artifacts
          cp "${apk}" \
            "ci-artifacts/mobileGF2logger-${GITHUB_SHA::12}-unsigned-verification-only.apk"
          cat > ci-artifacts/DO_NOT_DISTRIBUTE.txt <<'EOF'
          This unsigned APK exists only to verify compilation, lint, native
          packaging, minification, and resource shrinking in CI. It cannot be
          installed as a production update and must not be published.
          EOF

      - name: Upload unsigned verification artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-verification-only-do-not-distribute
          path: ci-artifacts/
          retention-days: 14
