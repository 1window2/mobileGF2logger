name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-cpp:
    name: Analyze C/C++
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Install required CMake
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - name: Build native release code
        run: >
          ./gradlew
          :app:externalNativeBuildRelease
          --rerun-tasks
          --no-daemon
          --stacktrace

      - name: Analyze C/C++
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:c-cpp"

  analyze-kotlin:
    name: Analyze Kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Compile Kotlin sources
        env:
          # Keep the scanner-only compatibility compiler isolated from every
          # persistent Gradle cache. Production builds continue to use the
          # patched 2.4.20-Beta1 plugin declared in build.gradle.
          GRADLE_USER_HOME: ${{ runner.temp }}/codeql-gradle-home
        run: >
          ./gradlew
          :app:compileDebugKotlin
          :protocol:compileDebugKotlin
          --init-script .github/codeql/codeql-kotlin-compat.init.gradle
          --rerun-tasks
          --no-build-cache
          --no-configuration-cache
          --no-daemon
          --stacktrace

      - name: Analyze Kotlin
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:java-kotlin"
