import java.security.KeyStore
import java.security.MessageDigest
import org.gradle.api.GradleException

plugins {
    id 'com.android.application'
}

def expectedReleaseSignerSha256 =
        '3B:6A:F9:A1:70:76:75:49:4E:FD:04:2A:17:D7:23:B2:3E:CB:96:C9:FF:53:DB:92:55:77:9C:F5:A5:FC:BF:01'
def releaseSigningProperties = new Properties()
def releaseSigningFile = rootProject.file('keystore.properties')
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigningProperties.load(it) }
}

def requiredReleaseSigningProperties = [
        'storeFile',
        'storePassword',
        'keyAlias',
        'keyPassword',
]
def missingReleaseSigningProperties = requiredReleaseSigningProperties.findAll { propertyName ->
    !releaseSigningProperties.getProperty(propertyName)?.trim()
}
def releaseStoreFile = null
def releaseSigningProblem = null

if (!releaseSigningFile.isFile()) {
    releaseSigningProblem = "${releaseSigningFile} is missing"
} else if (!missingReleaseSigningProperties.isEmpty()) {
    releaseSigningProblem =
            "keystore.properties is missing: ${missingReleaseSigningProperties.join(', ')}"
} else {
    def configuredStorePath = releaseSigningProperties.getProperty('storeFile').trim()
    def configuredStoreFile = new File(configuredStorePath)
    releaseStoreFile = configuredStoreFile.isAbsolute()
            ? configuredStoreFile
            : rootProject.file(configuredStorePath)

    if (!releaseStoreFile.isFile()) {
        releaseSigningProblem = "Release keystore is missing at ${releaseStoreFile}"
    } else {
        try {
            def keyStore = KeyStore.getInstance('PKCS12')
            releaseStoreFile.withInputStream { input ->
                keyStore.load(
                        input,
                        releaseSigningProperties.getProperty('storePassword').toCharArray(),
                )
            }
            def keyAlias = releaseSigningProperties.getProperty('keyAlias').trim()
            def certificate = keyStore.getCertificate(keyAlias)
            if (certificate == null) {
                releaseSigningProblem =
                        "Release certificate alias '${keyAlias}' is missing from ${releaseStoreFile}"
            } else if (!keyStore.isKeyEntry(keyAlias)) {
                releaseSigningProblem =
                        "Release alias '${keyAlias}' does not contain a private key"
            } else {
                def keyPassword = releaseSigningProperties
                        .getProperty('keyPassword')
                        .toCharArray()
                if (keyStore.getKey(keyAlias, keyPassword) == null) {
                    releaseSigningProblem =
                            "Release private key '${keyAlias}' could not be loaded"
                } else {
                    def actualReleaseSignerSha256 = MessageDigest
                            .getInstance('SHA-256')
                            .digest(certificate.encoded)
                            .collect { value -> String.format('%02X', value & 0xFF) }
                            .join(':')
                    if (actualReleaseSignerSha256 != expectedReleaseSignerSha256) {
                        releaseSigningProblem =
                                'Release certificate does not match the permanent ' +
                                'mobileGF2logger signing lineage. Expected ' +
                                "${expectedReleaseSignerSha256}, but found " +
                                "${actualReleaseSignerSha256}."
                    }
                }
            }
        } catch (Exception exception) {
            releaseSigningProblem =
                    "Release keystore could not be validated: ${exception.message}"
        }
    }
}

def hasReleaseSigning = releaseSigningProblem == null
def unsignedReleaseRequested = providers
        .gradleProperty('allowUnsignedRelease')
        .map { value -> value.toBoolean() }
        .orElse(false)
        .get()
def runningInCi = providers
        .environmentVariable('CI')
        .map { value -> value.equalsIgnoreCase('true') }
        .orElse(false)
        .get()
def allowUnsignedRelease = unsignedReleaseRequested && runningInCi
def releaseArtifactRequested = gradle.startParameter.taskNames.any { requestedTask ->
    def taskPathParts = requestedTask.tokenize(':')
    def taskName = taskPathParts.last()
    def requestedProject = taskPathParts.size() > 1
            ? taskPathParts[0..-2].join(':')
            : ''
    def targetsApplication = requestedProject.isEmpty() || requestedProject == 'app'

    targetsApplication &&
            (taskName in ['assemble', 'build', 'bundle'] ||
            taskName ==~ /(?i)(assemble|bundle|package|install|sign).*Release.*/
            )
}

def isReleaseArtifactTask = { task ->
    task.project == project &&
            task.name ==~ /(?i)(assemble|bundle|package|install|sign).*Release.*/
}

if (unsignedReleaseRequested && !runningInCi) {
    throw new GradleException(
            '-PallowUnsignedRelease=true is restricted to CI verification builds.',
    )
}

if (releaseArtifactRequested && !hasReleaseSigning && !allowUnsignedRelease) {
    throw new GradleException(
            'A release artifact was requested without the permanent production signer. ' +
            "${releaseSigningProblem}. Configure the ignored root-level " +
            'keystore.properties file. Unsigned release packaging is allowed only in ' +
            'CI verification builds.',
    )
}

// Check the resolved graph as well as literal command-line task names so
// abbreviations and tasks that depend on release packaging cannot bypass the signer gate.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any(isReleaseArtifactTask) &&
            !hasReleaseSigning && !allowUnsignedRelease) {
        throw new GradleException(
                'A release artifact task resolved without the permanent production signer. ' +
                "${releaseSigningProblem}. Configure the ignored root-level " +
                'keystore.properties file. Unsigned release packaging is allowed only in ' +
                'CI verification builds.',
        )
    }
}

android {
    namespace = 'dev.gf2log.app'
    compileSdk = 36

    defaultConfig {
        applicationId = 'dev.gf2log'
        minSdk = 26
        targetSdk = 36
        versionCode = 20101
        versionName = '2.1.1'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
            }
        }
    }

    testBuildType = 'debug'

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = releaseStoreFile
                storePassword = releaseSigningProperties.getProperty('storePassword')
                keyAlias = releaseSigningProperties.getProperty('keyAlias')
                keyPassword = releaseSigningProperties.getProperty('keyPassword')
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.testhost'
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            if (hasReleaseSigning && !allowUnsignedRelease) {
                signingConfig = signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    ndkVersion = '28.2.13676358'

    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':protocol')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
