plugins {
    id 'com.android.application'
}

def releaseSigningProperties = new Properties()
def releaseSigningFile = rootProject.file('keystore.properties')
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigningProperties.load(it) }
}
def releaseSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def hasReleaseSigning = releaseSigningKeys.every {
    releaseSigningProperties.getProperty(it)?.trim()
}

android {
    namespace = 'dev.gf2log.app'
    compileSdk = 36

    defaultConfig {
        applicationId = 'dev.gf2log'
        minSdk = 26
        targetSdk = 36
        versionCode = 20001
        versionName = '2.0.1'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
            }
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = rootProject.file(releaseSigningProperties.getProperty('storeFile'))
                storePassword = releaseSigningProperties.getProperty('storePassword')
                keyAlias = releaseSigningProperties.getProperty('keyAlias')
                keyPassword = releaseSigningProperties.getProperty('keyPassword')
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    ndkVersion = '28.2.13676358'

    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':protocol')
    testImplementation 'junit:junit:4.13.2'
}
